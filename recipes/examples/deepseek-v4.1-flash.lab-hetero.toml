# DeepSeek V4.1 Flash, one-user decode split across the RTX PRO (dense + hot experts) and the Strix pair (cold
# experts, one half per node over 1 GbE), calibrated by the hdec runs. The RTX owns exactly the measured W1 placement
# placement-pro80-f0 (7,600 experts, per-layer lists below, generated verbatim from the file); every other expert is
# owned by the pair. This is the STATIC placement, measured at 33.6 tok/s: no gain over today's pair (33.9). The
# measured 40.1 tok/s also needs a 10 GiB LRU on the RTX refilled from pinned host copies of pair-owned experts
# (<= 16 copies/token): v1 cannot express it (peer units are never fetched). Keep this recipe as the calibration point
# for that mode, not as a speed-up. hyperloom deploys ONE decode configuration per recipe, so this recipe decodes only
# on the hetero route (one sequence); use ../deepseek-v4.1-flash.lab.toml for batches.
schema = "strix-stream/recipe-v1"
name = "deepseek-v4.1-flash-lab-hetero"
description = "DeepSeek V4.1 Flash: R1 decode with dense + the W1 hot-expert set on the RTX PRO, cold experts on the pair (static placement)"
x-status = "measured (static placement); refill mode not expressible in v1"
x-schema = "wave4/recipes/core/schema-draft-5.md (Sol GO)"
x-benefit = "not needed: every RTX group is rank = list (the measured ownership), the pair takes the rest"
x-descriptor = "RTX side: dense of all 40 layers as fixed bytes (W1 reserve 9.55 GiB = 8.64 GB dense + state/buffers); pair side: attention + shared on each rank; same (layer, expert) identity"

[match]
model = "deepseek-v4.1-flash"

[[match.devices]]
id = "rtx"
kind = "cuda"
name = "RTX PRO 6000"
memory_min_gib = 94.0
host_ram_min_gib = 120.0

[[match.devices]]
id = "pair"
kind = "hip"
count = 2
memory_min_gib = 100.0
host_ram_min_gib = 119.0
internal_link = { kind = "usb4", gbps_min = 30.0 }

[[match.links]]
id = "pc-nodes"
between = ["rtx", "pair"]
kind = "ethernet"
gbps_min = 0.9

[[routes]]
id = "prefill_pair"
phase = "prefill"
devices = ["pair"]
execute = "tp"
handoff_route = "decode_hetero"
links = ["pc-nodes"]
x-handoff = "pair -> RTX state transfer (the RTX holds attention for all 40 layers); this direction is not measured"
[routes.placement.pair]
max_context_tokens = 2304
max_batch = 1
workspace_gib = 7.6

[[routes]]
id = "decode_hetero"
phase = "decode"
devices = ["rtx", "pair"]
execute = "hetero"
links = ["pc-nodes"]
[routes.placement.rtx]
device_gib = 83.0
max_context_tokens = 2304
max_batch = 1
workspace_gib = 1.5
