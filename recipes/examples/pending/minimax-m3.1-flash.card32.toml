note = "the projection assumes ~5 GB/s NVMe for the file tier (spec-rtx-prefill.md:32-33); the lab SN850X does 6.6-6.95 cold"
[x-evidence.mm-watchdog]
ref = "wave4/mmrtxpf/t7_run.sh:19"
quote = "WATCHDOG: free RAM ${free} GB"
[x-evidence.card32-mm-8k]
ref = "wave4/wstream/spec-rtx-prefill.md:250"
quote = "**MiniMax ≥ 8K at full speed** with enough pinned RAM (15.4 s at 8K with the PC's 70 GB)."
[x-evidence.card32-below-4k]
