"routes.decode_rtx_replica.placement.rtx.workspace_gib" = "dsrtx-kv"
"routes.decode_rtx_replica.placement.rtx.dynamic_slots_per_layer" = ["dsrtx-arena", "w1-expert-bytes"]
"routes.decode_rtx_replica.placement.rtx.ring_slots" = "w1-expert-bytes"
"routes.decode_rtx_replica.placement.rtx.lookahead_units" = "dsrtx-prefetch"
"routes.decode_pair.placement.pair.max_context_tokens" = "pair-long-context"
"routes.decode_pair.placement.pair.workspace_gib" = "pair-footprint"

