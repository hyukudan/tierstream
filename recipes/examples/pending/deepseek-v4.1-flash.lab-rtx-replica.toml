metric = "decode_tok_s"
batch = 1
value = 55
basis = "target"
scope = "the spec's acceptance gate, not a model of this budget (8,000 cached experts, 5.8 GiB of experts on NVMe); the smoke's ~45 % recall points to ~60 for the spec's own budget"
evidence = ["dsrtx-gate", "dsrtx-recall-risk"]
[[x-predicted]]
