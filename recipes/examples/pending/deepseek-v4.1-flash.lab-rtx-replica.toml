# PENDING (engine not run on the PRO): DeepSeek V4.1 Flash with a decode replica on the RTX PRO (streamed experts)
# next to the pair. The replica has not run on the PRO yet; hyperloom deploys one decode configuration per recipe, so
# this file (two decode routes) is a planning example until the orchestrator supports a replica lane. This is the INCLUSIVE mapping v1 can express: no planned residents, an expert cache of
# dynamic slots, a pinned host tier and the rest on NVMe; a miss outside the pinned tier reads NVMe. The spec's
# design is an EXCLUSIVE cache (VRAM LRU + pinned hold disjoint experts, NVMe never touched); main 20:12 asked the core
# for tier_mode = exclusive. Even exclusive, this budget's 8,000 cached experts leave 68.2 GiB of experts for a
# 62.4 GiB host tier: 5.8 GiB still on NVMe, so the spec's NVMe-free rows (65-75 tok/s, 8,630 cached) do not apply.
# No model exists for this exact configuration: the only number is the spec's acceptance gate (55 tok/s), a target.
schema = "strix-stream/recipe-v1"
name = "deepseek-v4.1-flash-lab-rtx-replica"
description = "DeepSeek V4.1 Flash: RTX PRO decode replica (expert cache + pinned + NVMe, <= 4 sequences per forward) admitted first; when it is not admissible the request decodes on the pair (<= 2 sequences)"
x-status = "pending: engine not run on the PRO; no calibrated model for this budget"
x-schema = "wave4/recipes/core/schema-draft-5.md (Sol GO)"

[match]
model = "deepseek-v4.1-flash"

[[match.devices]]
id = "pair"
kind = "hip"
count = 2
memory_min_gib = 100.0
host_ram_min_gib = 119.0
internal_link = { kind = "usb4", gbps_min = 30.0 }

[[match.devices]]
id = "rtx"
kind = "cuda"
name = "RTX PRO 6000"
memory_min_gib = 94.0
host_ram_min_gib = 120.0
disk_read_gbytes_ps_min = 6.0

[[match.links]]
id = "pc-nodes"
between = ["rtx", "pair"]
kind = "ethernet"
gbps_min = 0.9

[limits]
host_free_ram_floor_gib = 20.0

[[routes]]
id = "prefill_for_replica"
phase = "prefill"
devices = ["pair"]
execute = "tp"
handoff_route = "decode_rtx_replica"
links = ["pc-nodes"]
fallback = "prefill_pair"
x-handoff = "pair -> RTX replica state import; replica-side prefill and this direction of hand-off are not measured"
[routes.placement.pair]
max_context_tokens = 33024
max_batch = 1
workspace_gib = 7.6

[[routes]]
id = "prefill_pair"
phase = "prefill"
devices = ["pair"]
execute = "tp"
handoff_route = "decode_pair"
[routes.placement.pair]
max_context_tokens = 33024
max_batch = 1
workspace_gib = 7.6

[[routes]]
id = "decode_rtx_replica"
phase = "decode"
devices = ["rtx"]
execute = "single"
fallback = "decode_pair"
x-weight-identity = "must equal the pair's serve identity (ds41-exact-v1) for both lanes to serve one model"
[routes.placement.rtx]
device_gib = 92.0
host_pinned_gib = 62.4
max_context_tokens = 32768
max_batch = 4
workspace_gib = 1.5
dynamic_slots_per_layer = 200
ring_slots = 384
prefetch_layers = 0
lookahead_units = 4
policy = "lru"
pin_planned = false
[[routes.placement.rtx.units]]
id = "experts"
class = "moe"
rank = "frequency"
resident = 0
pinned = "fill"
rest = "disk"

[[routes]]
id = "decode_pair"
phase = "decode"
devices = ["pair"]
execute = "tp"
[routes.placement.pair]
max_context_tokens = 33024
max_batch = 2
workspace_gib = 7.6

[x-cites]
"match.devices.pair.memory_min_gib" = ["node-gtt", "pair-footprint"]
"match.devices.pair.host_ram_min_gib" = "node-gtt"
"match.devices.pair.internal_link.gbps_min" = "usb4-bw"
"match.devices.rtx.memory_min_gib" = "pro-vram"
"match.devices.rtx.host_ram_min_gib" = "pc-ram"
"match.devices.rtx.disk_read_gbytes_ps_min" = "dsrtx-nvme"
"match.links.pc-nodes.gbps_min" = "lan-bw"
"limits.host_free_ram_floor_gib" = "ds-physical-reserve"
"routes.prefill_for_replica.placement.pair.max_context_tokens" = "pair-long-context"
"routes.prefill_for_replica.placement.pair.workspace_gib" = "pair-footprint"
"routes.prefill_pair.placement.pair.max_context_tokens" = "pair-long-context"
"routes.prefill_pair.placement.pair.workspace_gib" = "pair-footprint"
"routes.decode_rtx_replica.placement.rtx.max_batch" = "ds-policy-lane"
