# DeepSeek V4.1 Flash on today's lab: the Strix Halo pair runs prefill and decode (TP over USB4); an RTX PRO 6000
# prefill route for long prompts (>= 2323 uncached tokens, state handed to the pair over 1 GbE) ships DISABLED
# (enabled = false): an offloaded request runs a composed weight identity (RTX base-model exact prefill + pair trellis
# decode) whose quality receipt is pending. Turn it on with an override once the receipt exists:
#   ss-recipe ... --set routes.prefill_long_rtx.enabled=true
# The RTX timings are the service's receipt with its OWN cap planning (91.7 GiB used at full VRAM); this placement
# (no unit groups = ss_plan_make on the adapter's descriptor, device_gib 93 -> 90.2 GiB room) does not reproduce that
# plan, so they are receipt-conditional comparisons, to be re-measured when the route is enabled.
schema = "strix-stream/recipe-v1"
name = "deepseek-v4.1-flash-lab"
description = "DeepSeek V4.1 Flash: pair TP prefill + decode; RTX PRO prefill from 2323 uncached tokens, shipped disabled until its quality receipt"
generated_by = "human"
x-status = "measured (pair: candidate cab238d6 + published; RTX route disabled, receipt-conditional)"
x-requires = "prompt_tokens in the request state = uncached length (core §8.3)"

[match]
model = "deepseek-v4.1-flash"

[[match.devices]]
id = "pair"
kind = "hip"
count = 2
memory_min_gib = 100.0
host_ram_min_gib = 119.0
internal_link = { kind = "usb4", gbps_min = 30.0 }

[[match.devices]]
id = "rtx"
kind = "cuda"
name = "RTX PRO 6000"
memory_min_gib = 94.0
host_ram_min_gib = 120.0
disk_read_gbytes_ps_min = 3.0

[[match.links]]
id = "pc-nodes"
between = ["rtx", "pair"]
kind = "ethernet"
gbps_min = 0.9

[limits]
host_free_ram_floor_gib = 20.0
host_free_commit_floor_gib = 14.0

# ---- prefill ----
[[routes]]
id = "prefill_long_rtx"
phase = "prefill"
enabled = false
devices = ["rtx"]
execute = "single"
handoff_route = "decode_pair"
links = ["pc-nodes"]
fallback = "prefill_pair"
when = { prompt_tokens_min = 2323 }
x-engine = "ds41-rtx-prefill service, --exact; plans its own cone residency from the cap (no unit groups)"
[routes.placement.rtx]
device_gib = 93.0
host_pinned_gib = 68.0
max_context_tokens = 32768
max_batch = 1
prefetch_layers = 1
idle_preload_layers = 2

[[routes]]
id = "prefill_pair"
phase = "prefill"
devices = ["pair"]
execute = "tp"
handoff_route = "decode_pair"
[routes.placement.pair]
max_context_tokens = 33024
max_batch = 1
workspace_gib = 7.6

# ---- decode ----
[[routes]]
id = "decode_pair"
phase = "decode"
devices = ["pair"]
execute = "tp"
[routes.placement.pair]
max_context_tokens = 33024
max_batch = 2
workspace_gib = 7.6

# ---- citations ----
[x-cites]
"match.devices.pair.memory_min_gib" = ["node-gtt", "pair-footprint"]
"match.devices.pair.host_ram_min_gib" = "node-gtt"
"match.devices.pair.internal_link.gbps_min" = "usb4-bw"
"match.devices.rtx.memory_min_gib" = "pro-vram"
"match.devices.rtx.host_ram_min_gib" = "pc-ram"
"match.devices.rtx.disk_read_gbytes_ps_min" = "pc-nvme"
"match.links.pc-nodes.gbps_min" = "lan-bw"
"limits.host_free_ram_floor_gib" = "ds-physical-reserve"
"limits.host_free_commit_floor_gib" = "ds-commit-floor"
"routes.prefill_long_rtx.placement.rtx.idle_preload_layers" = "ds-preload"
"routes.prefill_long_rtx.when.prompt_tokens_min" = ["ds-crossover", "ds-crossover-def"]
"routes.prefill_long_rtx.placement.rtx.device_gib" = "ds-rtx-vram"
"routes.prefill_long_rtx.placement.rtx.host_pinned_gib" = "ds-host-rule"
"routes.prefill_long_rtx.placement.rtx.max_context_tokens" = "ds-rtx-positions"
"routes.prefill_long_rtx.placement.rtx.prefetch_layers" = "ds-double-buffer"
"routes.prefill_pair.placement.pair.max_context_tokens" = "pair-long-context"
"routes.prefill_pair.placement.pair.workspace_gib" = "pair-footprint"
"routes.decode_pair.placement.pair.max_batch" = "pair-long-context"
"routes.decode_pair.placement.pair.max_context_tokens" = "pair-long-context"
"routes.decode_pair.placement.pair.workspace_gib" = "pair-footprint"

[[x-predicted]]
