schema = "tierstream/recipe-v1"
name = "ds41-rtx-replica-pro-only"
[match]
model = "DeepSeek-V4.1-Flash"
engine = "strix-cuda-ds41-replica"
[[match.devices]]
id = "rtx"
kind = "cuda"
name = "RTX PRO 6000"
memory_min_gib = 94
host_ram_min_gib = 120
[[routes]]
id = "decode_rtx"
phase = "decode"
devices = ["rtx"]
execute = "single"
max_rows = 6
[routes.placement.rtx]
device_gib = 90.0
host_pinned_gib = 76.0
host_pageable_gib = 6.0
host_available_floor_gib = 6.0
max_context_tokens = 131072
max_batch = 1
margin_gib = 0.6
margin_fraction = 0.0
[routes.components.drafter]
device = "auto"
